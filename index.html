<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0b1616" />
    <meta name="description" content="Telepon interaktif 3D bersama Spinosaurus." />
    <title>Spinosaurus Calling</title>
  </head>
  <body>
    <main id="app" class="app incoming" aria-live="polite">
      <canvas id="scene" aria-label="Spinosaurus 3D bergerak"></canvas>

      <div class="atmosphere" aria-hidden="true"></div>
      <div class="vignette" aria-hidden="true"></div>

      <section id="incomingScreen" class="screen incoming-screen">
        <header class="caller-heading">
          <div class="eyebrow"><span class="live-dot"></span> PANGGILAN MASUK</div>
          <h1>Spinosaurus</h1>
          <p>ingin ngobrol denganmu...</p>
        </header>

        <button id="soundHint" class="sound-hint" type="button">
          <span aria-hidden="true">♪</span> Ketuk layar untuk suara
        </button>

        <div class="incoming-actions">
          <div class="call-action">
            <button id="acceptBtn" class="round-button accept pulse" type="button" aria-label="Angkat telepon">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6.62 10.79a15.8 15.8 0 0 0 6.59 6.59l2.2-2.2a1 1 0 0 1 1.02-.24c1.12.37 2.33.57 3.57.57a1 1 0 0 1 1 1V20a1 1 0 0 1-1 1C10.61 21 3 13.39 3 4a1 1 0 0 1 1-1h3.5a1 1 0 0 1 1 1c0 1.25.2 2.45.57 3.57a1 1 0 0 1-.25 1.02l-2.2 2.2Z"/></svg>
            </button>
            <span>Angkat</span>
          </div>
          <div class="call-action">
            <button id="declineBtn" class="round-button decline" type="button" aria-label="Tolak telepon">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.68 11.03c4.92-3.86 11.72-3.86 16.64 0 .44.35.68.9.62 1.46l-.26 2.36a1.5 1.5 0 0 1-1.67 1.32l-3.07-.34a1.5 1.5 0 0 1-1.32-1.66l.1-.86a9.83 9.83 0 0 0-5.44 0l.1.86a1.5 1.5 0 0 1-1.32 1.66l-3.07.34a1.5 1.5 0 0 1-1.67-1.32l-.26-2.36c-.06-.56.17-1.11.62-1.46Z"/></svg>
            </button>
            <span>Tolak</span>
          </div>
        </div>
      </section>

      <section id="callScreen" class="screen call-screen" hidden>
        <header class="call-header">
          <div>
            <p class="call-label">Spinosaurus</p>
            <p id="callStatus" class="call-status"><span class="status-dot"></span> tersambung</p>
          </div>
          <time id="callTimer">00:00</time>
        </header>

        <div id="caption" class="caption" hidden>
          <span id="captionSpeaker">Spino</span>
          <p id="captionText"></p>
        </div>

        <div id="listeningBadge" class="listening-badge" hidden>
          <i></i><i></i><i></i><span>Mendengarkan...</span>
        </div>

        <form id="chatForm" class="chat-form" autocomplete="off">
          <label class="sr-only" for="chatInput">Ketik sesuatu untuk Spino</label>
          <input id="chatInput" type="text" maxlength="140" placeholder="Ketik kalau mikrofon tidak aktif..." />
          <button type="submit" aria-label="Kirim pesan">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m3.4 20.4 18-8a.44.44 0 0 0 0-.8l-18-8a.43.43 0 0 0-.6.45l1.1 6.52c.03.2.2.35.4.36l10.1.64-10.1.65a.43.43 0 0 0-.4.36l-1.1 6.51a.43.43 0 0 0 .6.46Z"/></svg>
          </button>
        </form>

        <nav class="call-controls" aria-label="Kontrol telepon">
          <button id="muteBtn" class="control-button" type="button" aria-label="Matikan mikrofon" aria-pressed="false">
            <svg class="mic-on" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 14a3 3 0 0 0 3-3V5a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3Zm5.3-3a5.3 5.3 0 0 1-10.6 0H5a7 7 0 0 0 6 6.92V21H8v2h8v-2h-3v-3.08A7 7 0 0 0 19 11h-1.7Z"/></svg>
            <svg class="mic-off" viewBox="0 0 24 24" aria-hidden="true"><path d="m4.27 3 16.97 16.97-1.27 1.27-3.2-3.2A7 7 0 0 1 13 19.92V23h-2v-3.08A7 7 0 0 1 5 13H3.3a8.7 8.7 0 0 0 7.7 8.65v.01h2v-.01a8.7 8.7 0 0 0 2.5-.67L3 4.27 4.27 3ZM9 5a3 3 0 0 1 5.78-1.13L9 9.65V5Zm6 6v-.73l-5.97-5.97A3 3 0 0 0 9 5v6a3 3 0 0 0 4.77 2.42l1.01 1.01A4.8 4.8 0 0 1 7.2 11H5.5a6.5 6.5 0 0 0 10.5 5.13l-1.2-1.2A4.97 4.97 0 0 0 15 11Z"/></svg>
            <span id="muteLabel">Mikrofon</span>
          </button>
          <button id="hangupBtn" class="control-button hangup" type="button" aria-label="Tutup telepon">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.68 11.03c4.92-3.86 11.72-3.86 16.64 0 .44.35.68.9.62 1.46l-.26 2.36a1.5 1.5 0 0 1-1.67 1.32l-3.07-.34a1.5 1.5 0 0 1-1.32-1.66l.1-.86a9.83 9.83 0 0 0-5.44 0l.1.86a1.5 1.5 0 0 1-1.32 1.66l-3.07.34a1.5 1.5 0 0 1-1.67-1.32l-.26-2.36c-.06-.56.17-1.11.62-1.46Z"/></svg>
            <span>Tutup</span>
          </button>
          <button id="voiceBtn" class="control-button" type="button" aria-label="Ganti suara">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a3 3 0 0 0-3 3v5a3 3 0 0 0 6 0V6a3 3 0 0 0-3-3Zm5 8a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21H8v2h8v-2h-3v-3.08A7 7 0 0 0 19 11h-2Z"/></svg>
            <span>Suara</span>
          </button>
        </nav>
      </section>

      <section id="endedScreen" class="screen ended-screen" hidden>
        <div class="ended-card">
          <div class="avatar">🦖</div>
          <p>Panggilan berakhir</p>
          <h2>Spinosaurus</h2>
          <span id="endedDuration">00:00</span>
          <button id="redialBtn" type="button">Telepon lagi</button>
        </div>
      </section>

      <dialog id="voiceDialog" class="voice-dialog">
        <form method="dialog">
          <div class="dialog-head">
            <div>
              <p>SUARA SPINO</p>
              <h2>Pilih suara</h2>
            </div>
            <button value="cancel" aria-label="Tutup">×</button>
          </div>
          <label for="voiceSelect">Suara yang tersedia di perangkat ini</label>
          <select id="voiceSelect"></select>
          <p class="voice-note">Suara “Natural”, “Online”, Google, atau Microsoft biasanya terdengar paling manusiawi.</p>
          <button id="testVoiceBtn" class="test-voice" type="button">Coba suara</button>
        </form>
      </dialog>

      <div id="toast" class="toast" role="status" hidden></div>
    </main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
